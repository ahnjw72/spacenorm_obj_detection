# Single published entry point for the whole monitoring stack.
#
# Why this exists: a Grafana Text panel's <img src="..."> is fetched by the
# BROWSER, not by Grafana's backend -- and the browser cannot resolve Swarm-
# internal service names (spacenorm_obj_detection_<site>), confirmed live
# when the per-camera dashboard's snapshot panel came back empty. Routing
# BOTH Grafana itself and the per-site snapshot fetches through this one
# nginx means:
#   - Grafana needs no published port of its own -- nginx reverse-proxies
#     "/" to it over the `monitoring` overlay network.
#   - The snapshot image URL in the per-camera dashboard can be a plain
#     relative path (/snapshot/<site>/<camera>), same origin as the
#     dashboard page itself -- no hardcoded host:port in the dashboard JSON,
#     works the same whether reached via localhost, a LAN IP, or a tunnel.
#   - Exactly one address is "how to reach the monitoring website" -- this
#     nginx's published port, nothing else.
#
# $upstream_host is resolved through an explicit allowlist (the map below),
# not interpolated directly from the request path -- the path segment is
# attacker/user-controlled, and proxy_pass-ing straight to whatever a client
# supplies would make this an open proxy into the Swarm overlay network (and
# Docker's embedded resolver, 127.0.0.11, forwards unknown names to the
# host's own upstream DNS, so an unconstrained version would let a client
# use this as a proxy out to the general internet too). Keep this list in
# sync with docker_swarm/monitoring/prometheus.yml's scrape target list.

resolver 127.0.0.11 valid=10s ipv6=off;

## Keys are the FULL Swarm service name (identity mapping -- this is an
## allowlist, not a lookup to a different value), matching exactly what
## Grafana's per_camera dashboard passes as $instance (regex-extracted from
## the Prometheus "instance" label, which is already the full service name).
map $site $upstream_host {
    default                                 "";
    spacenorm_obj_detection_cym             spacenorm_obj_detection_cym;
    spacenorm_obj_detection_jaeil_cr        spacenorm_obj_detection_jaeil_cr;
    spacenorm_obj_detection_jaeil_io        spacenorm_obj_detection_jaeil_io;
    spacenorm_obj_detection_kumho           spacenorm_obj_detection_kumho;
    spacenorm_obj_detection_kumho_car       spacenorm_obj_detection_kumho_car;
    spacenorm_obj_detection_yujin           spacenorm_obj_detection_yujin;
}

server {
    listen 8090;

    client_max_body_size 1m;

    # /snapshot/<site>/<camera-path> -> http://spacenorm_obj_detection_<site>:8081/snapshot/<camera-path>
    #
    # proxy_pass carries NO path suffix here, and the prefix strip is a
    # separate rewrite -- not an accident. An earlier version built the
    # forwarded path from the $camera_path regex capture directly in
    # proxy_pass (.../snapshot/$camera_path...), which looked fine in
    # `nginx -t` but broke at runtime: nginx decodes regex-captured
    # variables, and does NOT re-encode them when substituting into
    # proxy_pass. A camera name containing spaces/Korean text/# (the norm
    # for this fleet) arrived percent-encoded from the browser, got
    # decoded by the capture, and was forwarded as literal raw bytes --
    # invalid HTTP syntax (an unencoded space inside a request-target
    # breaks request-line parsing), confirmed via a raw TCP echo test
    # showing the literal garbled request line reaching the backend.
    # `rewrite ... break` + a bare `proxy_pass` (no appended URI) avoids
    # this: with no path suffix, nginx forwards the original request
    # target's encoding as received, confirmed via the same raw-echo test.
    location ~ ^/snapshot/(?<site>[a-zA-Z0-9_]+)/ {
        if ($upstream_host = "") {
            return 404;
        }

        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        rewrite ^/snapshot/[a-zA-Z0-9_]+/(.*)$ /snapshot/$1 break;
        proxy_pass http://$upstream_host:8081;
    }

    # /config/<site>/<camera-path> -> http://spacenorm_obj_detection_<site>:8081/config/<camera-path>
    #
    # Same site-allowlist + "rewrite ... break + bare proxy_pass" shape as
    # /snapshot/ above, for the same reason: a camera name containing
    # spaces/Korean text/# must reach the backend with its original
    # encoding intact, not decoded-then-forwarded-as-raw-bytes (see the
    # /snapshot/ block's comment for the confirmed failure mode).
    location ~ ^/config/(?<site>[a-zA-Z0-9_]+)/ {
        if ($upstream_host = "") {
            return 404;
        }

        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        rewrite ^/config/[a-zA-Z0-9_]+/(.*)$ /config/$1 break;
        proxy_pass http://$upstream_host:8081;
    }

    # Everything else goes to Grafana. Resolved via a variable, same as the
    # /snapshot/ location -- a bare hostname in proxy_pass is resolved ONCE
    # at nginx startup/config-load, which would crash-loop this whole
    # service if it starts even slightly before Grafana's DNS entry is
    # ready (no ordering guarantee between Swarm services). Confirmed this
    # distinction locally: `nginx -t` failed immediately on a bare
    # `proxy_pass http://grafana:3000` with "host not found in upstream",
    # exactly the failure mode this avoids.
    location / {
        set $grafana_upstream grafana;
        proxy_pass http://$grafana_upstream:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Grafana's live-update features use WebSockets.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
